---
# Odoo 19 Multi-Instance Installation Playbook
# هذا الملف موحد ويُستخدم من قبل كل من Jenkins و Terminal
# يضمن نفس الإعدادات ونفس خطوات التثبيت في الطريقتين

- name: Install Odoo 19 Multi-Instance
  hosts: odoo_instances
  become: yes
  vars_files:
    - ../../instances/odoo19.yml

  pre_tasks:
    - name: Validate instance variables
      ansible.builtin.assert:
        that:
          - odoo_instances is defined
          - odoo_instances | length > 0
          - docker_network is defined
        fail_msg: "متغيرات النشر غير مكتملة. يرجى التحقق من ملف instances/odoo19.yml"
        success_msg: "متغيرات النشر صحيحة"

  roles:
    - role: system
    - role: docker

  tasks:
    - name: Deploy Odoo 19 instances
      ansible.builtin.include_role:
        name: odoo
      loop: "{{ odoo_instances }}"

  post_tasks:
    - name: Deployment completed successfully
      ansible.builtin.debug:
        msg: "✓ تم نشر جميع نسخ Odoo 19 بنجاح: {{ odoo_instances | map(attribute='name') | join(', ') }}"
