# ==============================================================================
# Odoo 19 + PostgreSQL 18 - Traefik Compose (optional reverse-proxy mode)
#
# Used by install-odoo.sh --with-traefik. Odoo joins the shared external
# "proxy" network and is routed over HTTPS; PostgreSQL stays private.
# ==============================================================================
name: odoo19

services:
  db:
    container_name: odoo19-db
    image: ${PG_IMAGE:-postgres:18}
    user: root
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo19}
      - POSTGRES_DB=postgres
    volumes:
      - ./postgresql:/var/lib/postgresql/18/docker
    networks:
      - internal

  odoo19:
    container_name: odoo19
    image: ${ODOO_IMAGE:-odoo:19}
    user: root
    depends_on:
      - db
    restart: always
    tty: true
    command: ["--config=/etc/odoo/odoo.conf"]
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo19}
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${DOCKER_PROXY_NETWORK:-proxy}"

      traefik.http.routers.odoo19.rule: "Host(`${ODOO_DOMAIN:?ODOO_DOMAIN is required}`)"
      traefik.http.routers.odoo19.entrypoints: "websecure"
      traefik.http.routers.odoo19.tls.certresolver: "letsencrypt"
      traefik.http.routers.odoo19.service: "odoo19"
      traefik.http.services.odoo19.loadbalancer.server.port: "8069"

      traefik.http.routers.odoo19-websocket.rule: "Host(`${ODOO_DOMAIN:?ODOO_DOMAIN is required}`) && PathPrefix(`/websocket`)"
      traefik.http.routers.odoo19-websocket.entrypoints: "websecure"
      traefik.http.routers.odoo19-websocket.tls.certresolver: "letsencrypt"
      traefik.http.routers.odoo19-websocket.priority: "100"
      traefik.http.routers.odoo19-websocket.service: "odoo19-websocket"
      traefik.http.services.odoo19-websocket.loadbalancer.server.port: "8072"

networks:
  internal:
    name: ${ODOO_NETWORK:-odoo19_internal}
    driver: bridge
  proxy:
    external: true
    name: ${DOCKER_PROXY_NETWORK:-proxy}
