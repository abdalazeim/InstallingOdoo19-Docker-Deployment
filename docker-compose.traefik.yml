services:
  db:
    container_name: ${ODOO_DB_CONTAINER_NAME:-odoo19-db}
    image: ${PG_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./postgresql:/var/lib/postgresql/18/docker
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  odoo19:
    container_name: ${ODOO_CONTAINER_NAME:-odoo19}
    image: ${ODOO_IMAGE:-odoo:19}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["--config=/tmp/odoo.conf"]
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?Set ODOO_ADMIN_PASSWORD in .env}
      ODOO_PROXY_MODE: "True"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./addons:/mnt/extra-addons:ro
      - ./etc:/etc/odoo:ro
      - odoo_data:/var/lib/odoo
    networks:
      - internal
      - proxy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}.rule=Host(`${ODOO_DOMAIN:?Set ODOO_DOMAIN in .env}`)"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}.entrypoints=websecure"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}.service=${ODOO_ROUTER_NAME:-odoo19}"
      - "traefik.http.services.${ODOO_ROUTER_NAME:-odoo19}.loadbalancer.server.port=8069"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}-websocket.rule=Host(`${ODOO_DOMAIN:?Set ODOO_DOMAIN in .env}`) && PathPrefix(`/websocket`)"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}-websocket.entrypoints=websecure"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}-websocket.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}-websocket.priority=100"
      - "traefik.http.routers.${ODOO_ROUTER_NAME:-odoo19}-websocket.service=${ODOO_ROUTER_NAME:-odoo19}-websocket"
      - "traefik.http.services.${ODOO_ROUTER_NAME:-odoo19}-websocket.loadbalancer.server.port=8072"

networks:
  internal:
    name: ${ODOO_NETWORK:-odoo19_internal}
    driver: bridge
  proxy:
    external: true
    name: ${DOCKER_PROXY_NETWORK:-proxy}

volumes:
  odoo_data:
    name: ${ODOO_DATA_VOLUME:-odoo19_data}
