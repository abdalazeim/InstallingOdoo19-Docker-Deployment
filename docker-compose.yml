# Odoo 19 Private Repository - Infrastructure Manager Edition
#
# مستودع خاص لـ Odoo 19 يعتمد على الأفكار من Odoo-MultiVersion-Deployment
# ولكن محسن ليتناسب مع نظام مدير البنية التحتية (Infrastructure Manager).
#
# الميزات:
# - دعم متغيرات البيئة (لا كلمات مرور مكتوبة ضمنيًا)
# - دعم ترافيك كبروكسي عكسي (HTTPS)
# - وضع ستاندون (وصول مباشر)
# - شبكة داخلية معزولة لكل ideal
# - EntryPoint آمن مع انتظار PostgreSQL
# - ملف .gitignore آمن يستبعد الأسرار والبيانات

version: '3.8'

services:
  db:
    container_name: ${ODOO_DB_CONTAINER_NAME:-odoo19-db}
    image: ${PG_IMAGE:-postgres:18}
    user: root
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo19}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo@19}
      - POSTGRES_DB=${POSTGRES_DB:-postgre}
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    networks:
      - internal

  odoo19:
    container_name: ${ODOO_CONTAINER_NAME:-odoo19}
    image: ${ODOO_IMAGE:-odoo:19}
    user: root
    depends_on:
      - db
    restart: always
    tty: true
    command: ["--config=/tmp/odoo.conf"]
    environment:
      - HOST=db
      - PORT=5432
      - USER=${POSTGRES_USER:-odoo19}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo@19}
      - ODOO_ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD:-Admin@19}
      - PIP_BREAK_SYSTEM_PACKAGES=1
    ports:
      - "${ODOO_HTTP_PORT:-10019}:8069"
      - "${ODOO_CHAT_PORT:-20019}:8072"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
      - odoo_data:/var/lib/odoo
    networks:
      - internal

networks:
  internal:
    name: ${ODOO_NETWORK:-odoo19_internal}
    driver: bridge

volumes:
  odoo_data:
