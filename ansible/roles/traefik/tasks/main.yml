---
# Odoo 19 Multi-Instance - Traefik Role Tasks
# يتحقق من وجود شبكة Traefik وتكوينها

- name: Check Traefik proxy network exists
  community.docker.docker_network_info:
    name: "{{ docker_network }}"
  register: traefik_network
  changed_when: false

- name: Create Traefik proxy network if missing
  community.docker.docker_network:
    name: "{{ docker_network }}"
    driver: bridge
    state: present
  when: traefik_network.exists | default(false) | bool == false

- name: Verify Traefik container is running
  community.docker.docker_container_info:
    name: traefik
  register: traefik_container
  changed_when: false
  failed_when: traefik_container.exists | default(false) | bool == false

- name: Display Traefik status
  ansible.builtin.debug:
    msg: "حاوية ترافيك: {{ traefik_container.container.State.Status | default('غير موجودة') }}"