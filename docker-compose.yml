# Odoo 19 Private Repository - Infrastructure Manager Edition
#
# Features:
# - Environment-driven configuration (no hard-coded passwords)
# - Optional Traefik/HTTPS reverse-proxy mode
# - Direct host-port (standalone) mode
# - Isolated internal network per deployment
# - Safe entrypoint with PostgreSQL readiness gate
# - PostgreSQL data stored in a named volume (no host permission issues)
#
# PostgreSQL 18 stores data in a major-version directory (PGDATA), so the
# legacy "/var/lib/postgresql/data" mount point is not supported. This file
# uses the Docker-managed volume "odoo_pgdata", which avoids host ownership
# problems entirely. See docker-compose.bindmount.yml for a host-path variant.

services:
  db:
    container_name: ${ODOO_DB_CONTAINER_NAME:-odoo19-db}
    image: ${PG_IMAGE:-postgres:18}
    user: root
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo19}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo@19}
      - POSTGRES_DB=${POSTGRES_DB:-postgre}
      - PGDATA=/var/lib/postgresql/18/docker
    volumes:
      - odoo_pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo19} -d ${POSTGRES_DB:-postgre}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  odoo19:
    container_name: ${ODOO_CONTAINER_NAME:-odoo19}
    image: ${ODOO_IMAGE:-odoo:19}
    user: root
    depends_on:
      db:
        condition: service_healthy
    restart: always
    tty: true
    command: ["--config=/tmp/odoo.conf"]
    environment:
      - HOST=db
      - PORT=5432
      - USER=${POSTGRES_USER:-odoo19}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo@19}
      - ODOO_ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD:-Admin@19}
      - ODOO_DB_NAME=${ODOO_DB_NAME:-odoo19}
      - ODOO_AUTO_INIT=${ODOO_AUTO_INIT:-1}
      - PIP_BREAK_SYSTEM_PACKAGES=1
    ports:
      - "${ODOO_HTTP_PORT:-10019}:8069"
      - "${ODOO_CHAT_PORT:-20019}:8072"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
      - odoo_data:/var/lib/odoo
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - internal

networks:
  internal:
    name: ${ODOO_NETWORK:-odoo19_internal}
    driver: bridge

volumes:
  odoo_data:
  odoo_pgdata: